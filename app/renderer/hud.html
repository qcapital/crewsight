<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>CrewSight HUD</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #card{position:absolute;width:360px;background:rgba(13,15,18,.92);border:1px solid #2a2f35;border-radius:6px;overflow:hidden;
        font:600 12px "Segoe UI",sans-serif;color:#d8dde3;opacity:0;transition:opacity .15s;pointer-events:none}
  #card.show{opacity:1}
  #card.top{left:50%;top:24px;transform:translateX(-50%)} #card.bottom{left:50%;bottom:24px;transform:translateX(-50%)}
  #card.left{left:24px;top:50%;transform:translateY(-50%)} #card.right{right:24px;top:50%;transform:translateY(-50%)}
  #card .head{padding:5px 8px;letter-spacing:.06em}
  #card .shot{position:relative}#card img{display:block;width:100%}
  #card .x{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #ff3b30;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.7)}
</style></head>
<body><canvas id="cv"></canvas><div id="card"></div><script src="hud.js"></script></body></html>
