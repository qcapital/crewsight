<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' https: wss: ws:">
<title>CrewSight Overlay</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:12px/1.2 "Segoe UI",system-ui,sans-serif;color:#d8dde3;user-select:none}
  #frame{position:absolute;inset:0;background:rgba(10,12,14,.92);border:1px solid #2a2f35;border-radius:6px;overflow:hidden}
  body.ct #frame{border-color:transparent}
  #bar{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;gap:8px;padding:0 8px;
       background:rgba(16,19,22,.9);-webkit-app-region:drag;z-index:3;font-size:11px;letter-spacing:.04em}
  body.ct #bar{display:none}
  #bar button{-webkit-app-region:no-drag;background:#1e2328;color:#c9d1d9;border:1px solid #333a42;border-radius:3px;font-size:11px;padding:1px 6px;cursor:pointer}
  .pill{padding:1px 6px;border-radius:3px;background:#1e2328;white-space:nowrap}
  .ok{color:#7ee787}.warn{color:#f2cc60}.bad{color:#ff7b72}.dim{color:#8b949e}
  #video{display:none}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #ctBadge{position:absolute;right:6px;top:6px;z-index:4;font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.55);color:#8b949e;display:none}
  body.ct #ctBadge{display:block}
  #msg{position:absolute;left:0;right:0;top:45%;text-align:center;color:#8b949e;font-size:13px;z-index:2;pointer-events:none}
  #state{position:absolute;left:6px;bottom:5px;z-index:4;font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.55)}
</style></head>
<body>
<div id="frame">
  <div id="bar">
    <span id="title" class="pill">CREW VIEW</span>
    <span id="link" class="pill dim">NO SESSION</span>
    <span id="share" class="pill dim">NOT SHARING</span>
    <span style="flex:1"></span>
    <button id="btnCT" title="Click-through (Ctrl+Alt+C)">Click-through</button>
    <button id="btnSettings">Settings</button>
  </div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="cv"></canvas>
  <div id="msg">Waiting for crew member's screen share…</div>
  <div id="ctBadge">CLICK-THROUGH</div>
  <div id="state" class="dim">—</div>
</div>
<script src="../../node_modules/peerjs/dist/peerjs.min.js"></script>
<script src="overlay.js"></script>
</body></html>
