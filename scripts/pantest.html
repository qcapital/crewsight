<!doctype html>
<html><head><meta charset="utf-8"><title>Test yaw=0</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c" width="320" height="180"></canvas>
<script>
// Synthetic "gunner view": a textured 3D world seen through a pinhole camera (90° horizontal FOV) that turns
// right at a known rate after a short pause. The title reports the true yaw so the self-test can compare.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, D = Math.PI / 180, F = (W / 2) / Math.tan(45 * D);
const RATE = Number(new URLSearchParams(location.search).get('rate') || 15), START = 4000;
const t0 = performance.now();
function tex(x, y, z) {
  let t = 128 + 40 * Math.sin(9 * x + 3 * z) * Math.cos(7 * y - 2 * z) + 30 * Math.sin(23 * y + 11 * x) + 25 * Math.cos(31 * z - 17 * y);
  const h = Math.sin(Math.floor(x * 20) * 12.9898 + Math.floor(y * 20) * 78.233 + Math.floor(z * 20) * 37.719) * 43758.5453;
  return Math.max(0, Math.min(255, t + 30 * (h - Math.floor(h) - 0.5)));
}
const img = ctx.createImageData(W, H);
function frame() {
  const t = performance.now() - t0, yaw = Math.max(0, (t - START) / 1000) * RATE * D;
  const c = Math.cos(yaw), s = Math.sin(yaw);
  for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
    const rx = F, ry = px - W / 2 + 0.5, rz = -(py - H / 2 + 0.5), n = Math.hypot(rx, ry, rz);
    const bx = rx / n, by = ry / n, bz = rz / n;
    const v = tex(c * bx - s * by, s * bx + c * by, bz); // rotate about z by yaw (turn right)
    const i = (py * W + px) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.title = (new URLSearchParams(location.search).get('title') || 'PanTest') + ' yaw=' + (yaw / D).toFixed(2);
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
